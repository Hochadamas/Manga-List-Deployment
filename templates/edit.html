{% extends "base.html" %}
{% block page_title %}編集 — {{ manga.title }}{% endblock %}
{% block content %}

<h2>「{{ manga.title }}」を編集</h2>
<form method="post" enctype="multipart/form-data" class="manga-form">
  <label for="title">タイトル *</label>
  <input type="text" id="title" name="title" maxlength="150" required value="{{ manga.title }}">

  <label for="author">作者 *</label>
  <input type="text" id="author" name="author" maxlength="100" required value="{{ manga.author }}">

  <label for="genre">ジャンル</label>
  <input type="text" id="genre" name="genre" list="genre-list" value="{{ manga.genre or '' }}">
  <datalist id="genre-list">
    <option value="少年"><option value="少女"><option value="青年">
    <option value="女性"><option value="異世界"><option value="ホラー">
    <option value="コメディ"><option value="恋愛"><option value="アクション">
    <option value="ファンタジー">
  </datalist>

  <div class="row">
    <div>
      <label for="volumes_owned">所有冊数</label>
      <input type="number" id="volumes_owned" name="volumes_owned" min="0" value="{{ manga.volumes_owned }}">
    </div>
    <div>
      <label for="volumes_read">既読冊数</label>
      <input type="number" id="volumes_read" name="volumes_read" min="0" value="{{ manga.volumes_read }}">
    </div>
  </div>

  <label for="status">ステータス *</label>
  <select id="status" name="status" required>
    {% for s in statuses %}
    <option value="{{ s }}" {% if manga.status == s %}selected{% endif %}>{{ s }}</option>
    {% endfor %}
  </select>

  <label for="rating">評価（10点満点）</label>
  <input type="number" id="rating" name="rating" min="0" max="10" step="0.5" value="{{ manga.rating if manga.rating is not none else '' }}">

  <label for="comment">感想・コメント</label>
  <textarea id="comment" name="comment" rows="4">{{ manga.comment or '' }}</textarea>

  <label for="image">表紙画像</label>
  {% if manga.image %}
    <div class="image-preview">
      <img src="{{ url_for('static', filename='uploads/' ~ manga.image) }}" alt="現在の表紙">
      <p>現在の表紙（差し替える場合はファイルを選択）</p>
    </div>
  {% endif %}
  <input type="file" id="image" name="image" accept="image/png, image/jpeg, image/gif, image/webp">

  <button type="submit" class="button button-primary">変更を保存</button>
</form>

<form method="post" action="{{ url_for('delete', manga_id=manga.id) }}" class="delete-form">
  <button type="submit" class="button button-delete">この漫画を削除</button>
</form>

{% endblock %}
