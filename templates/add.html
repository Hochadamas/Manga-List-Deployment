{% extends "base.html" %}
{% block page_title %}漫画を追加{% endblock %}
{% block content %}

<h2>漫画をリストに追加</h2>
<form method="post" enctype="multipart/form-data" class="manga-form">
  <label for="title">タイトル *</label>
  <input type="text" id="title" name="title" maxlength="150" required value="{{ form.title or '' }}">

  <label for="author">作者 *</label>
  <input type="text" id="author" name="author" maxlength="100" required value="{{ form.author or '' }}">

  <label for="genre">ジャンル</label>
  <input type="text" id="genre" name="genre" list="genre-list" value="{{ form.genre or '' }}">
  <datalist id="genre-list">
    <option value="少年"><option value="少女"><option value="青年">
    <option value="女性"><option value="異世界"><option value="ホラー">
    <option value="コメディ"><option value="恋愛"><option value="アクション">
    <option value="ファンタジー">
  </datalist>

  <div class="row">
    <div>
      <label for="volumes_owned">所有冊数</label>
      <input type="number" id="volumes_owned" name="volumes_owned" min="0" value="{{ form.volumes_owned or 0 }}">
    </div>
    <div>
      <label for="volumes_read">既読冊数</label>
      <input type="number" id="volumes_read" name="volumes_read" min="0" value="{{ form.volumes_read or 0 }}">
    </div>
  </div>

  <label for="status">ステータス *</label>
  <select id="status" name="status" required>
    <option value="">-- 選択してください --</option>
    {% for s in statuses %}
    <option value="{{ s }}" {% if form.status == s %}selected{% endif %}>{{ s }}</option>
    {% endfor %}
  </select>

  <label for="rating">評価（10点満点）</label>
  <input type="number" id="rating" name="rating" min="0" max="10" step="0.5" value="{{ form.rating or '' }}">

  <label for="comment">感想・コメント</label>
  <textarea id="comment" name="comment" rows="4">{{ form.comment or '' }}</textarea>

  <label for="image">表紙画像</label>
  <input type="file" id="image" name="image" accept="image/png, image/jpeg, image/gif, image/webp">

  <button type="submit" class="button button-primary">リストに追加</button>
</form>

{% endblock %}
